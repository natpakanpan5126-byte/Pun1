<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกการเก็บเงินห้อง</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js สำหรับการจัดการ State (แทน React useState/useEffect) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Chart.js สำหรับทำกราฟ (แทน Recharts) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        [x-cloak] { display: none !important; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800" x-data="fundTracker()">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative pb-20">
        <!-- Header -->
        <div class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
            <h1 class="text-xl font-bold text-center">บันทึกการเก็บเงินห้อง</h1>
            
            <template x-if="activeTab === 'dashboard' || activeTab === 'add'">
                <div class="mt-4 text-center">
                    <p class="text-blue-100 text-sm">ยอดเงินรวมทั้งหมด</p>
                    <p class="text-3xl font-bold">฿<span x-text="totalAmount.toLocaleString()"></span></p>
                </div>
            </template>
        </div>

        <!-- Content Area -->
        <div class="p-4">
            
            <!-- TAB: Dashboard -->
            <div x-show="activeTab === 'dashboard'" x-cloak x-transition.opacity>
                <!-- Goal Section -->
                <div class="bg-blue-50 rounded-xl p-4 mb-6 border border-blue-100">
                    <div class="flex justify-between items-end mb-2">
                        <div>
                            <p class="text-sm text-blue-600 font-medium">เป้าหมาย: <span x-text="goal.title"></span></p>
                            <p class="text-xs text-gray-500 mt-1">กำหนด: <span x-text="formatDate(goal.deadline)"></span></p>
                        </div>
                        <div class="text-right">
                            <p class="text-lg font-bold text-blue-700">฿<span x-text="goal.amount.toLocaleString()"></span></p>
                        </div>
                    </div>
                    
                    <!-- Progress Bar -->
                    <div class="w-full bg-gray-200 rounded-full h-2.5 mt-2">
                        <div class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" :style="`width: ${Math.min(progressPercentage, 100)}%`"></div>
                    </div>
                    <div class="flex justify-between mt-1 text-xs text-gray-500">
                        <span>ความคืบหน้า <span x-text="progressPercentage"></span>%</span>
                        <span x-text="`ขาดอีก ฿${Math.max(0, goal.amount - totalAmount).toLocaleString()}`"></span>
                    </div>
                </div>

                <!-- Chart Section -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6">
                    <h3 class="text-md font-semibold text-gray-700 mb-4">สรุปยอดรับเงินรายเดือน</h3>
                    <div class="h-48">
                        <canvas id="monthlyChart"></canvas>
                    </div>
                </div>

                <!-- Recent Transactions -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-md font-semibold text-gray-700">รายการล่าสุด</h3>
                        <button @click="activeTab = 'history'" class="text-sm text-blue-600">ดูทั้งหมด</button>
                    </div>
                    
                    <div class="space-y-3">
                        <template x-for="item in recentTransactions" :key="item.id">
                            <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold">
                                        <span x-text="item.name.charAt(0)"></span>
                                    </div>
                                    <div>
                                        <p class="font-medium text-gray-800" x-text="item.name"></p>
                                        <p class="text-xs text-gray-500" x-text="formatDate(item.date)"></p>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <p class="font-bold text-green-600">+฿<span x-text="item.amount.toLocaleString()"></span></p>
                                    <p class="text-xs text-gray-500" x-text="item.note || '-'"></p>
                                </div>
                            </div>
                        </template>
                        <template x-if="recentTransactions.length === 0">
                            <p class="text-center text-gray-500 text-sm py-4">ยังไม่มีรายการ</p>
                        </template>
                    </div>
                </div>
            </div>

            <!-- TAB: Add Transaction -->
            <div x-show="activeTab === 'add'" x-cloak x-transition.opacity>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">บันทึกรับเงิน</h2>
                    
                    <form @submit.prevent="addTransaction" class="space-y-4">
                        <!-- Name Autocomplete -->
                        <div class="relative">
                            <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อผู้จ่าย</label>
                            <input 
                                type="text" 
                                x-model="addForm.name"
                                @focus="showDropdown = true"
                                @input="showDropdown = true"
                                @click.away="showDropdown = false"
                                placeholder="พิมพ์ชื่อเพื่อค้นหา..."
                                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow"
                                required
                            >
                            
                            <!-- Dropdown -->
                            <div 
                                x-show="showDropdown && filteredNames.length > 0"
                                x-transition
                                class="absolute z-50 w-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-48 overflow-y-auto"
                            >
                                <template x-for="name in filteredNames" :key="name">
                                    <div 
                                        @click="addForm.name = name; showDropdown = false"
                                        class="p-3 hover:bg-blue-50 cursor-pointer border-b border-gray-50 last:border-0"
                                    >
                                        <span x-text="name"></span>
                                    </div>
                                </template>
                            </div>
                            
                            <template x-if="showDropdown && addForm.name && filteredNames.length === 0">
                                <div class="absolute z-50 w-full mt-1 bg-gray-50 border border-gray-200 rounded-lg shadow-sm p-3 text-sm text-gray-500">
                                    จะบันทึกเป็นรายชื่อใหม่
                                </div>
                            </template>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">จำนวนเงิน (บาท)</label>
                            <input 
                                type="number" 
                                x-model.number="addForm.amount"
                                placeholder="0"
                                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                required
                                min="1"
                            >
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">วันที่</label>
                            <input 
                                type="date" 
                                x-model="addForm.date"
                                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                required
                            >
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">หมายเหตุ (ถ้ามี)</label>
                            <input 
                                type="text" 
                                x-model="addForm.note"
                                placeholder="เช่น ค่าชีท, ค่ากิจกรรม"
                                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                            >
                        </div>

                        <button 
                            type="submit" 
                            class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition-colors mt-6 flex justify-center items-center gap-2"
                        >
                            <i data-lucide="save" class="w-5 h-5"></i>
                            บันทึกข้อมูล
                        </button>
                    </form>
                </div>
            </div>

            <!-- TAB: Members -->
            <div x-show="activeTab === 'members'" x-cloak x-transition.opacity>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-4">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">นำเข้ารายชื่อจาก Excel</h2>
                    <p class="text-sm text-gray-500 mb-2">ก๊อปปี้รายชื่อจากคอลัมน์ใน Excel มาวางที่นี่ (1 บรรทัดต่อ 1 ชื่อ)</p>
                    <textarea 
                        x-model="importText"
                        rows="4" 
                        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none mb-3"
                        placeholder="ด.ช. สมชาย รักเรียน&#10;ด.ญ. สมหญิง จริงใจ"
                    ></textarea>
                    <button 
                        @click="importMembers"
                        class="w-full bg-green-600 text-white font-bold py-2 rounded-lg hover:bg-green-700 transition-colors"
                    >
                        นำเข้ารายชื่อ
                    </button>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-gray-800">รายชื่อทั้งหมด (<span x-text="members.length"></span>)</h2>
                    </div>
                    
                    <div class="space-y-2 max-h-96 overflow-y-auto pr-2">
                        <template x-for="(member, index) in members" :key="index">
                            <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg border border-gray-100">
                                <span class="font-medium text-gray-700" x-text="member"></span>
                                <button @click="removeMember(member)" class="text-red-500 hover:bg-red-50 p-1 rounded">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </template>
                        <template x-if="members.length === 0">
                            <p class="text-center text-gray-500 text-sm py-4">ยังไม่มีรายชื่อในระบบ</p>
                        </template>
                    </div>
                </div>
            </div>

            <!-- TAB: History -->
            <div x-show="activeTab === 'history'" x-cloak x-transition.opacity>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">ประวัติการรับเงิน</h2>
                    
                    <!-- Month Filter -->
                    <div class="mb-4">
                        <label class="block text-sm text-gray-600 mb-1">กรองตามเดือน</label>
                        <select 
                            x-model="filterMonth" 
                            class="w-full p-2 border border-gray-300 rounded-lg outline-none"
                        >
                            <option value="all">ทั้งหมด</option>
                            <template x-for="month in availableMonths" :key="month.val">
                                <option :value="month.val" x-text="month.label"></option>
                            </template>
                        </select>
                    </div>

                    <!-- History List -->
                    <div class="space-y-3">
                        <template x-for="item in filteredHistory" :key="item.id">
                            <div class="p-3 bg-gray-50 rounded-lg border border-gray-200">
                                <div class="flex justify-between items-start mb-1">
                                    <p class="font-bold text-gray-800" x-text="item.name"></p>
                                    <p class="font-bold text-green-600">฿<span x-text="item.amount.toLocaleString()"></span></p>
                                </div>
                                <div class="flex justify-between items-center text-sm">
                                    <p class="text-gray-500" x-text="formatDate(item.date)"></p>
                                    <p class="text-gray-500 italic" x-text="item.note"></p>
                                </div>
                                <div class="mt-2 text-right">
                                    <button 
                                        @click="deleteTransaction(item.id)" 
                                        class="text-xs text-red-500 hover:text-red-700 underline"
                                    >ลบรายการนี้</button>
                                </div>
                            </div>
                        </template>
                        <template x-if="filteredHistory.length === 0">
                            <p class="text-center text-gray-500 text-sm py-8">ไม่พบข้อมูลในเดือนที่เลือก</p>
                        </template>
                    </div>
                </div>
            </div>

            <!-- TAB: Goal -->
            <div x-show="activeTab === 'goal'" x-cloak x-transition.opacity>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">ตั้งเป้าหมายการเก็บเงิน</h2>
                    
                    <form @submit.prevent="saveGoal" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อเป้าหมาย</label>
                            <input 
                                type="text" 
                                x-model="goalForm.title"
                                placeholder="เช่น จัดปาร์ตี้ปีใหม่, ซื้อของขวัญครู"
                                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                required
                            >
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ยอดเงินเป้าหมายรวม (บาท)</label>
                            <input 
                                type="number" 
                                x-model.number="goalForm.amount"
                                placeholder="0"
                                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                required
                                min="1"
                            >
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">กำหนดเสร็จสิ้น</label>
                            <input 
                                type="date" 
                                x-model="goalForm.deadline"
                                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                required
                            >
                        </div>

                        <button 
                            type="submit" 
                            class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition-colors mt-6 flex justify-center items-center gap-2"
                        >
                            <i data-lucide="target" class="w-5 h-5"></i>
                            บันทึกเป้าหมาย
                        </button>
                    </form>
                </div>
            </div>

        </div>

        <!-- Bottom Navigation -->
        <div class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-200 flex justify-around p-2 pb-safe shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-40">
            <button @click="activeTab = 'dashboard'" :class="{'text-blue-600': activeTab === 'dashboard', 'text-gray-400': activeTab !== 'dashboard'}" class="flex flex-col items-center p-2 w-16 transition-colors">
                <i data-lucide="layout-dashboard" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-medium">หน้าหลัก</span>
            </button>
            <button @click="activeTab = 'add'" :class="{'text-blue-600': activeTab === 'add', 'text-gray-400': activeTab !== 'add'}" class="flex flex-col items-center p-2 w-16 transition-colors">
                <i data-lucide="plus-circle" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-medium">รับเงิน</span>
            </button>
            <button @click="activeTab = 'members'" :class="{'text-blue-600': activeTab === 'members', 'text-gray-400': activeTab !== 'members'}" class="flex flex-col items-center p-2 w-16 transition-colors">
                <i data-lucide="users" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-medium">รายชื่อ</span>
            </button>
            <button @click="activeTab = 'history'" :class="{'text-blue-600': activeTab === 'history', 'text-gray-400': activeTab !== 'history'}" class="flex flex-col items-center p-2 w-16 transition-colors">
                <i data-lucide="history" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-medium">ประวัติ</span>
            </button>
            <button @click="activeTab = 'goal'" :class="{'text-blue-600': activeTab === 'goal', 'text-gray-400': activeTab !== 'goal'}" class="flex flex-col items-center p-2 w-16 transition-colors">
                <i data-lucide="target" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-medium">เป้าหมาย</span>
            </button>
        </div>
        
        <!-- Toast Notification -->
        <div 
            x-show="toast.show" 
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 transform translate-y-2"
            x-transition:enter-end="opacity-100 transform translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 transform translate-y-0"
            x-transition:leave-end="opacity-0 transform translate-y-2"
            class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium"
            x-text="toast.message"
            x-cloak
        ></div>

    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        function fundTracker() {
            return {
                activeTab: 'dashboard',
                
                // Data States
                transactions: [],
                members: [],
                goal: {
                    title: 'ทริปจบการศึกษา',
                    amount: 5000,
                    deadline: new Date().toISOString().split('T')[0]
                },
                
                // Forms
                addForm: {
                    name: '',
                    amount: '',
                    date: new Date().toISOString().split('T')[0],
                    note: ''
                },
                goalForm: {
                    title: '',
                    amount: '',
                    deadline: ''
                },
                
                // UI States
                showDropdown: false,
                importText: '',
                filterMonth: 'all',
                toast: { show: false, message: '' },
                chartInstance: null,

                init() {
                    // Load data from LocalStorage (Simulating Firebase for HTML version)
                    const savedTx = localStorage.getItem('fund_transactions');
                    const savedMembers = localStorage.getItem('fund_members');
                    const savedGoal = localStorage.getItem('fund_goal');
                    
                    if (savedTx) this.transactions = JSON.parse(savedTx);
                    if (savedMembers) this.members = JSON.parse(savedMembers);
                    if (savedGoal) {
                        this.goal = JSON.parse(savedGoal);
                        this.goalForm = { ...this.goal };
                    } else {
                        this.goalForm = { ...this.goal };
                    }

                    // Watch for tab changes to render chart
                    this.$watch('activeTab', (value) => {
                        if (value === 'dashboard') {
                            setTimeout(() => this.renderChart(), 100);
                        }
                    });

                    // Initial render if on dashboard
                    if (this.activeTab === 'dashboard') {
                        setTimeout(() => this.renderChart(), 100);
                    }
                },

                // Computed Properties
                get totalAmount() {
                    return this.transactions.reduce((sum, tx) => sum + Number(tx.amount), 0);
                },

                get progressPercentage() {
                    if (!this.goal.amount) return 0;
                    return Math.round((this.totalAmount / this.goal.amount) * 100);
                },

                get recentTransactions() {
                    return [...this.transactions]
                        .sort((a, b) => new Date(b.date) - new Date(a.date))
                        .slice(0, 3);
                },

                get filteredNames() {
                    const search = this.addForm.name.toLowerCase().trim();
                    if (!search) return this.members;
                    return this.members.filter(m => m.toLowerCase().includes(search));
                },

                get availableMonths() {
                    const months = new Set();
                    this.transactions.forEach(tx => {
                        const d = new Date(tx.date);
                        months.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
                    });
                    
                    return Array.from(months)
                        .sort().reverse()
                        .map(m => {
                            const [year, month] = m.split('-');
                            const date = new Date(year, month - 1);
                            return {
                                val: m,
                                label: date.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' })
                            };
                        });
                },

                get filteredHistory() {
                    let filtered = [...this.transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
                    
                    if (this.filterMonth !== 'all') {
                        filtered = filtered.filter(tx => {
                            const d = new Date(tx.date);
                            const txMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                            return txMonth === this.filterMonth;
                        });
                    }
                    return filtered;
                },

                // Actions
                saveData() {
                    localStorage.setItem('fund_transactions', JSON.stringify(this.transactions));
                    localStorage.setItem('fund_members', JSON.stringify(this.members));
                    localStorage.setItem('fund_goal', JSON.stringify(this.goal));
                },

                showToast(msg) {
                    this.toast.message = msg;
                    this.toast.show = true;
                    setTimeout(() => { this.toast.show = false; }, 3000);
                },

                addTransaction() {
                    if (!this.addForm.name || !this.addForm.amount || !this.addForm.date) return;

                    const newTx = {
                        id: Date.now().toString(),
                        ...this.addForm,
                        amount: Number(this.addForm.amount)
                    };

                    this.transactions.push(newTx);
                    
                    // Auto add to members if new
                    const nameTrimmed = this.addForm.name.trim();
                    if (nameTrimmed && !this.members.includes(nameTrimmed)) {
                        this.members.push(nameTrimmed);
                        this.members.sort((a, b) => a.localeCompare(b, 'th'));
                    }

                    this.saveData();
                    this.showToast('บันทึกรับเงินเรียบร้อยแล้ว');
                    
                    // Reset form
                    this.addForm = {
                        name: '',
                        amount: '',
                        date: new Date().toISOString().split('T')[0],
                        note: ''
                    };
                    this.showDropdown = false;
                    
                    // Re-render chart if active
                    if (this.activeTab === 'dashboard') this.renderChart();
                },

                deleteTransaction(id) {
                    if(confirm('ต้องการลบรายการนี้ใช่หรือไม่?')) {
                        this.transactions = this.transactions.filter(tx => tx.id !== id);
                        this.saveData();
                        this.showToast('ลบรายการเรียบร้อย');
                        if (this.activeTab === 'dashboard') this.renderChart();
                    }
                },

                importMembers() {
                    if (!this.importText.trim()) return;
                    
                    const newNames = this.importText
                        .split('\n')
                        .map(n => n.trim())
                        .filter(n => n !== '');
                        
                    let addedCount = 0;
                    newNames.forEach(name => {
                        if (!this.members.includes(name)) {
                            this.members.push(name);
                            addedCount++;
                        }
                    });
                    
                    if (addedCount > 0) {
                        this.members.sort((a, b) => a.localeCompare(b, 'th'));
                        this.saveData();
                        this.showToast(`นำเข้าสำเร็จ ${addedCount} รายชื่อ`);
                    } else {
                        this.showToast('ไม่มีรายชื่อใหม่ถูกเพิ่ม');
                    }
                    
                    this.importText = '';
                },

                removeMember(name) {
                    if(confirm(`ต้องการลบ ${name} ออกจากรายชื่อใช่หรือไม่? (ประวัติการจ่ายเงินของคนนี้จะยังอยู่)`)) {
                        this.members = this.members.filter(m => m !== name);
                        this.saveData();
                        this.showToast('ลบรายชื่อเรียบร้อย');
                    }
                },

                saveGoal() {
                    this.goal = { ...this.goalForm };
                    this.saveData();
                    this.showToast('บันทึกเป้าหมายเรียบร้อย');
                    this.activeTab = 'dashboard';
                },

                // Utilities
                formatDate(dateString) {
                    if (!dateString) return '';
                    const date = new Date(dateString);
                    return date.toLocaleDateString('th-TH', {
                        day: 'numeric',
                        month: 'short',
                        year: 'numeric'
                    });
                },

                // Chart Rendering
                renderChart() {
                    const ctx = document.getElementById('monthlyChart');
                    if (!ctx) return;

                    // Aggregate data by month
                    const monthlyData = {};
                    this.transactions.forEach(tx => {
                        const d = new Date(tx.date);
                        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                        const label = d.toLocaleDateString('th-TH', { month: 'short', year: '2-digit' });
                        
                        if (!monthlyData[key]) {
                            monthlyData[key] = { label, amount: 0, sortKey: key };
                        }
                        monthlyData[key].amount += Number(tx.amount);
                    });

                    // Sort by date and take last 6 months
                    const sortedData = Object.values(monthlyData)
                        .sort((a, b) => a.sortKey.localeCompare(b.sortKey))
                        .slice(-6);

                    const labels = sortedData.map(d => d.label);
                    const data = sortedData.map(d => d.amount);

                    // If no data, show empty chart
                    if (labels.length === 0) {
                        labels.push('ยังไม่มีข้อมูล');
                        data.push(0);
                    }

                    if (this.chartInstance) {
                        this.chartInstance.destroy();
                    }

                    this.chartInstance = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'ยอดรับ (บาท)',
                                data: data,
                                backgroundColor: 'rgba(37, 99, 235, 0.8)',
                                borderRadius: 4,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        callback: function(value) {
                                            return '฿' + value.toLocaleString();
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
</html>
